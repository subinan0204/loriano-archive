<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LORIANO 저장소 확인</title>
<style>
body{font-family:system-ui,sans-serif;max-width:680px;margin:36px auto;padding:0 18px;line-height:1.6;color:#222}
button{font:inherit;padding:12px 18px;border:0;border-radius:9px;background:#8293bb;color:#fff}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f5f7;padding:14px;border-radius:8px}
</style>
</head>
<body>
<h2>LORIANO 저장소 확인</h2>
<p>이 페이지는 현재 Chrome에 등록된 데이터베이스 목록을 확인한 뒤, 기존 영상 데이터만 읽습니다. 새 데이터베이스를 만들거나 기존 기록을 수정·삭제하지 않습니다.</p>
<button id="check">저장소 확인 및 내보내기</button>
<pre id="out">버튼을 눌러 확인해 주세요.</pre>
<script>
const out=document.getElementById('out');
document.getElementById('check').addEventListener('click',async()=>{
  out.textContent='확인 중…';
  let db;
  try{
    if(!indexedDB.databases) throw new Error('이 Chrome에서는 데이터베이스 목록 확인 기능을 지원하지 않습니다.');
    const list=await indexedDB.databases();
    const info=list.map(x=>({name:x.name,version:x.version}));
    const found=list.find(x=>x.name==='loriano-archive-v1');
    if(!found){
      out.textContent='현재 이 페이지에서 확인되는 데이터베이스 목록:\n'+JSON.stringify(info,null,2)+'\n\nloriano-archive-v1 데이터베이스가 이 브라우저 공간에 없습니다. 새 데이터베이스는 만들지 않았습니다.';
      return;
    }
    db=await new Promise((resolve,reject)=>{
      const req=indexedDB.open('loriano-archive-v1');
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
      req.onupgradeneeded=()=>{req.transaction.abort();reject(new Error('기존 데이터베이스가 예상과 다르게 열렸습니다.'));};
    });
    const stores=[...db.objectStoreNames];
    if(!stores.includes('videos')) throw new Error('기존 DB에 videos 저장소가 없습니다. 저장소: '+stores.join(', '));
    const videos=await new Promise((resolve,reject)=>{
      const tx=db.transaction('videos','readonly');
      const req=tx.objectStore('videos').getAll();
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>reject(req.error);
    });
    out.textContent='페이지 주소: '+location.href+
      '\n데이터베이스 목록: '+JSON.stringify(info)+
      '\n대상 DB 버전: '+db.version+
      '\n저장소: '+stores.join(', ')+
      '\n영상 개수: '+videos.length;
    if(videos.length){
      const blob=new Blob([JSON.stringify(videos,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='loriano-videos-device.json';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
      out.textContent+='\n\nJSON 파일 다운로드를 시작했어요.';
    }else{
      out.textContent+='\n\n영상이 0개라 파일은 만들지 않았어요.';
    }
  }catch(e){out.textContent='확인 실패: '+(e?.message||e);}
  finally{if(db)db.close();}
});
</script>
</body>
</html>
