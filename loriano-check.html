<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LORIANO 영상 목록 내보내기</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 18px; line-height: 1.6; color: #222; }
    button { font: inherit; padding: 12px 18px; border: 0; border-radius: 9px; background: #8293bb; color: white; cursor: pointer; }
    #status { margin-top: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>LORIANO 영상 목록 내보내기</h2>
  <p>이 페이지는 현재 브라우저에 저장된 영상 목록을 읽어 JSON 파일로 저장합니다.</p>
  <p><strong>기존 데이터는 수정하거나 삭제하지 않습니다.</strong></p>
  <button id="export">영상 목록 내보내기</button>
  <div id="status" role="status"></div>
  <script>
    const status = document.getElementById('status');
    document.getElementById('export').addEventListener('click', async () => {
      status.textContent = '데이터베이스를 확인하고 있어요…';
      let db;
      try {
        db = await new Promise((resolve, reject) => {
          const request = indexedDB.open('loriano-archive-v1');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
          request.onupgradeneeded = () => {
            request.transaction.abort();
            reject(new Error('아카이브 데이터베이스를 찾지 못했습니다. 먼저 아카이브 페이지를 열어 주세요.'));
          };
        });
        if (!db.objectStoreNames.contains('videos')) {
          throw new Error('videos 저장소를 찾지 못했습니다.');
        }
        const videos = await new Promise((resolve, reject) => {
          const tx = db.transaction('videos', 'readonly');
          const request = tx.objectStore('videos').getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
        const blob = new Blob([JSON.stringify(videos, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'loriano-videos-device.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        status.textContent = `완료! 영상 ${videos.length}개를 파일로 저장했어요.`;
      } catch (error) {
        status.textContent = '내보내기에 실패했어요: ' + (error?.message || error);
      } finally {
        if (db) db.close();
      }
    });
  </script>
</body>
</html>
